<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#08111f" />
  <title>Page Not Found | Ferdaws Qaem</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Manrope:wght@600;700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100svh; display: grid; place-items: center; padding: 24px; background: #08111f; color: #f5f8fc; font-family: "DM Sans", sans-serif; }
    main { width: min(100%, 620px); padding: clamp(32px, 8vw, 72px); border: 1px solid rgba(170,194,222,.2); border-radius: 28px; background: #111e31; box-shadow: 0 24px 70px rgba(0,0,0,.3); }
    .code { margin-bottom: 28px; color: #5da7ff; font-family: "Roboto Mono", monospace; font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin-bottom: 16px; font-family: "Manrope", sans-serif; font-size: clamp(2.5rem, 8vw, 4.5rem); line-height: 1.05; letter-spacing: -.04em; }
    p { color: #b5c1d1; font-size: 1.05rem; line-height: 1.7; }
    a { display: inline-flex; margin-top: 30px; padding: 13px 18px; border-radius: 12px; background: #2f86ee; color: white; font-weight: 700; text-decoration: none; transition: transform .18s ease, background .18s ease; }
    a:hover { transform: translateY(-2px); background: #5da7ff; }
    a:focus-visible { outline: 3px solid #53e3cb; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="code">Error 404</p>
    <h1>This page is off the map.</h1>
    <p>The link may have changed, but the portfolio is still right where it should be.</p>
    <a href="/portfolio/">Return to portfolio →</a>
  </main>
</body>
</html>
